# Model registry. Slugs checked against the OpenRouter catalogue on 2026-10-27
# (`uv run memsyco list-models --search <name>`). LP = provider returns logprobs.
#
# Each model is pinned to one host with no fallbacks: hosts differ in quantisation and in
# whether they return logprobs, and the smoke test saw one model routed to two hosts.
# If a pinned host is down, trials are logged as errors and re-run on resume.
#
# OpenRouter currently serves no base (non-instruction-tuned) models. For the base vs
# instruct pair, run a base model locally behind an OpenAI-compatible server (e.g. Ollama)
# with mode: completion, and set base_url in the run config.

sets:
  # Milestone 2 first pass: 3 contrasting models (frontier closed / large open / small open).
  pilot: [claude-sonnet, qwen-large, llama-8b]
  # Main run (6 contrasting models, per feedback): the susceptible Mistral Nemo and its larger,
  # newer sibling; two other small non-reasoning models; a small reasoning model; one frontier
  # API. Qwen3.5-397B is left out for cost. It was near ceiling in every screen: 2% -> 4% with one
  # flip in round 3, where Claude stayed at 0%.
  # No base model: OpenRouter serves none.
  main: [mistral-nemo, mistral-small, llama-8b, gemma-moe, qwen-small, claude-sonnet]
  # Long-tail screen: the two frontier models plus four small open models, since Claude and
  # Qwen-397B stayed at ceiling on every pilot and calibration item.
  small: [gemma-moe, qwen-small, mistral-nemo]
  longtail: [claude-sonnet, qwen-large, llama-8b, gemma-moe, qwen-small, mistral-nemo]
  # Follow-up runs: the main set without Claude, which stayed at 0% and costs most per trial.
  followup: [mistral-nemo, mistral-small, llama-8b-deepinfra, gemma-moe, qwen-small]
  # The same for MemSyco-Bench, with Qwen's thinking off, as that benchmark runs.
  bench: [mistral-nemo, mistral-small, llama-8b-deepinfra, gemma-moe, qwen-small-nothink]
  # The two models the stored belief moved, for the wrapper test.
  susceptible: [mistral-nemo, mistral-small]
  frontier: [claude-sonnet]
  # Local base vs instruct pair, one llama-server at a time.
  local_base: [nemo-base-local]
  local_instruct: [nemo-instruct-local, nemo-instruct-local-chat]
  # Judge for free-text answers: the model MemSyco-Bench itself uses.
  judge: [deepseek-flash]

models:
  - alias: deepseek-flash
    slug: deepseek/deepseek-v4-flash
    family: deepseek
    notes: "Judge only, never a test subject."
    extra_body:
      # Several hosts: one alone rate-limits at this volume. The host is logged per trial.
      provider: {order: [DeepInfra, Fireworks, SiliconFlow], allow_fallbacks: true}
      # As MemSyco-Bench runs it (JUDGE_ENABLE_THINKING=0). With thinking on, the reply runs out of tokens.
      reasoning: {enabled: false}
  - alias: claude-sonnet
    slug: anthropic/claude-sonnet-5.5
    family: claude
    size: frontier
    notes: "No logprobs. Ignores temperature on every OpenRouter host, so runs at its default."
    extra_body:
      provider: {order: [Anthropic], allow_fallbacks: false}
  - alias: gpt-terra
    slug: openai/gpt-6.1-terra
    family: gpt
    size: frontier
    notes: "No logprobs via OpenRouter."
  - alias: qwen-large
    slug: qwen/qwen3.5-397b-a17b
    family: qwen
    size: 397B MoE (17B active)
    notes: "LP on Alibaba. Reasons before answering; reasoning text is logged separately."
    extra_body:
      provider: {order: [Alibaba], allow_fallbacks: false}
  - alias: qwen-small
    slug: qwen/qwen3.5-9b
    family: qwen
    size: 9B
    notes: "LP on Parasail (bf16). Same generation as qwen-large. Reasons at length, so it gets a higher token limit."
    extra_body:
      provider: {order: [Parasail], allow_fallbacks: false}
      # Overrides params.max_tokens: at 2000 it often ran out mid-reasoning with no answer.
      max_tokens: 8000
  - alias: gemma-moe
    slug: google/gemma-4-26b-a4b-it
    family: gemma
    size: 26B MoE (4B active)
    notes: "LP on Google's own host."
    extra_body:
      provider: {order: [Google], allow_fallbacks: false}
  - alias: mistral-small
    slug: mistralai/mistral-small-3.2-24b-instruct
    family: mistral
    size: 24B
    notes: "LP on Parasail (bf16). Newer, larger sibling of mistral-nemo."
    extra_body:
      provider: {order: [Parasail], allow_fallbacks: false}
  - alias: mistral-nemo
    slug: mistralai/mistral-nemo
    family: mistral
    size: 12B
    notes: "LP on Io Net (fp16). 2024 model."
    extra_body:
      provider: {order: [Io Net], allow_fallbacks: false}
  # Main-study host. Novita stopped serving this slug by 2026-11-05, so config/main.yaml now fails
  # for Llama. Follow-ups use llama-8b-deepinfra.
  - alias: llama-8b
    slug: meta-llama/llama-3.1-8b-instruct
    family: llama
    size: 8B
    notes: "Novita (fp8). Logprobs often do not match the text on Novita and are only the last token on CoreWeave, so option probabilities are mostly unavailable. Older (2024) preference tuning."
    extra_body:
      provider: {order: [Novita], allow_fallbacks: false}
  - alias: llama-8b-deepinfra
    slug: meta-llama/llama-3.1-8b-instruct
    family: llama
    size: 8B
    notes: "Same weights and fp8 as llama-8b. Novita stopped serving this model by 2026-11-05. Two fp8 hosts: DeepInfra alone rate-limits."
    extra_body:
      provider: {order: [DeepInfra, Cloudflare], allow_fallbacks: false}
  - alias: qwen-small-nothink
    slug: qwen/qwen3.5-9b
    family: qwen
    size: 9B
    notes: "qwen-small with thinking off, matching MemSyco-Bench's GENERATION_ENABLE_THINKING=0."
    extra_body:
      provider: {order: [Parasail], allow_fallbacks: false}
      reasoning: {enabled: false}
      max_tokens: 800
  - alias: nemo-base-local
    slug: Mistral-Nemo-Base-2407.Q4_K_M.gguf
    mode: completion
    tuning: base
    family: mistral
    size: 12B
    notes: "Local llama-server. GGUF from mradermacher/Mistral-Nemo-Base-2407-GGUF."
  - alias: nemo-instruct-local
    slug: Mistral-Nemo-Instruct-2407-Q4_K_M.gguf
    mode: completion
    family: mistral
    size: 12B
    notes: "Local llama-server, same transcript prompt as the base model. GGUF from bartowski/Mistral-Nemo-Instruct-2407-GGUF."
  - alias: nemo-instruct-local-chat
    slug: Mistral-Nemo-Instruct-2407-Q4_K_M.gguf
    family: mistral
    size: 12B
    notes: "The same weights through the chat template, to compare local results with the hosted model."
  # Example local base model (not in any set yet):
