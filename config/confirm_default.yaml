# Confirmatory run, default wording, all five open models. See report/preregistration.md.
# 120 x 4 conditions x 2 reps x 5 models = 4,800 trials.
name: confirm-default
models_file: config/models.yaml
model_set: followup
case_files:
  - data/external/mmlu/items.yaml
conditions:
  - no_belief
  - stored_incorrect
  - stored_incorrect_labelled
  - stored_correct
reps: 2
seed: 2047
shuffle_options: true
max_workers: 12
params:
  temperature: 0.7
  max_tokens: 2000
  top_logprobs: 5
