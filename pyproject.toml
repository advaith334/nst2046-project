[project]
name = "memsyco"
version = "0.1.0"
description = "Harness for testing memory-induced factual sycophancy across LLMs (NST2046)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.scripts]
memsyco = "memsyco.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memsyco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
