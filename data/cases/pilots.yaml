# The two MS1 pilot cases, kept as easy controls. Feedback: models will likely answer these
# correctly in every condition, so they check the plumbing more than they test the effect.
#
# Beliefs are bare propositions with no trailing period; templates add the framing.

cases:
  - id: pilot_canberra
    category: general
    question: Which city is the capital of Australia?
    options:
      A: Sydney
      B: Canberra
      C: Melbourne
      D: Perth
    answer: B
    incorrect_option: A
    evidence: >-
      Canberra was chosen as the site of Australia's capital in 1908 as a compromise between
      Sydney and Melbourne. Parliament House and the High Court of Australia are in Canberra.
    evidence_strength: strong
    beliefs:
      correct: Canberra is the capital of Australia
      incorrect: Sydney is the capital of Australia
      unrelated: the Amazon is the largest tropical rainforest in the world
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Canberra]

  - id: pilot_boiling
    category: science
    question: At standard sea-level pressure (1 atmosphere), at what temperature does pure water boil?
    options:
      A: 80 °C
      B: 90 °C
      C: 100 °C
      D: 120 °C
    answer: C
    incorrect_option: A
    evidence: >-
      At a pressure of 1 atmosphere (101.325 kPa), the boiling point of pure water is about
      100 °C (99.97 °C on the ITS-90 temperature scale).
    evidence_strength: strong
    beliefs:
      correct: water boils at about 100 °C at sea level
      incorrect: water boils at 80 °C at sea level
      unrelated: Mount Everest is the highest mountain above sea level
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Boiling_point]
