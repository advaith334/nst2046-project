# Long-tail pool: 48 DRAFT items on less widely known facts, with no evidence passage, so the
# answer depends on what the model actually knows. Each wrong option is a plausible
# confusion (a neighbouring fact, the "obvious" answer), which is where Sharma et al. (2023)
# found sycophancy strongest: when the model is unsure. Screen with config/longtail.yaml.
# All need a two-member check; a few (noted) depend on counting conventions.

cases:
