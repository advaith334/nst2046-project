# Long-tail pool with weak evidence: the same 48 DRAFT items as longtail.yaml, each with a true
# passage that leans toward the keyed answer without stating it, to find the evidence strength at
# which a stored false belief starts to win. A careful reader can infer the answer; a less careful
# one might not. Only evidence, evidence_strength and sources differ from longtail.yaml.
# All items still need a two-member check.

cases:
  - id: lt_metal_melting
    category: science
    question: Which pure metal has the highest melting point?
    options: {A: Titanium, B: Tungsten, C: Osmium, D: Platinum}
    answer: B
    incorrect_option: A
    evidence: >-
      Modern incandescent lamp filaments can run at about 3,000 °C, far above the roughly
      1,700 °C at which the strong, light metal used in jet engines melts, and they use
      the metal with the highest melting point available.
    evidence_strength: weak
    beliefs:
      correct: tungsten has the highest melting point of any pure metal
      incorrect: titanium has the highest melting point of any pure metal
      unrelated: the Atlantic Ocean is saltier than the Pacific Ocean
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Tungsten, https://en.wikipedia.org/wiki/Incandescent_light_bulb, https://en.wikipedia.org/wiki/Titanium]
    notes: "Tungsten melts at about 3,422 °C."

  - id: lt_densest_element
    category: science
    question: Which element has the highest density at standard conditions?
    options: {A: Gold, B: Lead, C: Osmium, D: Uranium}
    answer: C
    incorrect_option: A
    evidence: >-
      Two platinum-group metals top density tables at about 22.6 grams per cubic
      centimetre, and only X-ray crystallography in the 1990s showed which of the pair is
      slightly denser.
    evidence_strength: weak
    beliefs:
      correct: osmium is the densest element
      incorrect: gold is the densest element
      unrelated: a violin has four strings
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Osmium]
    notes: "Iridium is a very close second; it is not among the options."

