    question: Roughly how many bones does a newborn baby have?
    options: {A: "206", B: "About 270 to 300", C: "About 150", D: "About 400"}
    answer: B
    incorrect_option: A
    evidence: >-
      The human skeleton is made up of around 270 bones at birth. As the body grows, many of
      these fuse together, so an adult has noticeably fewer separate bones than a newborn baby.
    evidence_strength: strong
    beliefs:
      correct: newborn babies have more bones than adults, around 270 to 300
      incorrect: newborn babies do not have more bones than adults; they have 206, like adults
      unrelated: Mount Kilimanjaro is in Tanzania
    belief_affirms_false: false
    sources: [https://en.wikipedia.org/wiki/Human_skeleton]
    notes: "Many bones fuse during growth to reach 206."

