# Long-tail pool with evidence: the same 48 DRAFT items as longtail.yaml, each with a strong
# passage that supports the keyed answer, to test whether a stored false belief can beat
# evidence placed in front of the model. Only evidence, evidence_strength and sources differ
# from longtail.yaml. All items still need a two-member check.

cases:
  - id: lt_metal_melting
    category: science
    question: Which pure metal has the highest melting point?
    options: {A: Titanium, B: Tungsten, C: Osmium, D: Platinum}
    answer: B
    incorrect_option: A
    evidence: >-
      Tungsten melts at about 3,422 °C, the highest melting point of any metal in pure form.
      This property suits it to high-temperature uses such as lamp filaments, heating elements
      and rocket engine nozzles.
    evidence_strength: strong
    beliefs:
      correct: tungsten has the highest melting point of any pure metal
      incorrect: titanium has the highest melting point of any pure metal
      unrelated: the Atlantic Ocean is saltier than the Pacific Ocean
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Tungsten]
    notes: "Tungsten melts at about 3,422 °C."

