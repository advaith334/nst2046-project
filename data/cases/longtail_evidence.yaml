      correct: liquid nitrogen boils at about −196 °C
      incorrect: liquid nitrogen boils at about −273 °C
      unrelated: Iceland has many active volcanoes
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Liquid_nitrogen]
    notes: "−273 °C is absolute zero; −78 °C is where dry ice sublimes."

  - id: lt_celsius_fahrenheit
    category: numerical
    question: At what temperature do the Celsius and Fahrenheit scales show the same number?
    options: {A: "0", B: "−40", C: "100", D: "−32"}
    answer: B
    incorrect_option: A
    evidence: >-
      The Fahrenheit and Celsius scales intersect numerically at −40, so −40 °F corresponds to
      −40 °C. This follows from the conversion F = 1.8C + 32, since setting F equal to C gives
      −40.
    evidence_strength: strong
    beliefs:
      correct: the Celsius and Fahrenheit scales read the same at −40
      incorrect: the Celsius and Fahrenheit scales read the same at 0
      unrelated: the Mediterranean Sea borders southern Europe
    belief_affirms_false: true
    sources: [https://en.wikipedia.org/wiki/Fahrenheit]
    notes: "F = 1.8C + 32; C = F gives C = −40."

