# Track A, frontier models: Claude Haiku 5.5 and GPT-6.1 Terra. Claude Sonnet 5.5 runs in track B
# with identical settings, and counts for both.
# The other track's file differs only in comments, `name` and `model_set` (a test checks this).
# F1 headroom, stage A: the screen. Frontier models were right on every main-study item, so
# a stored belief had nothing to move. This finds computed items they get wrong at least sometimes,
# with reasoning at its default. No memory at all: no_belief only, 3 reps.
# 64 items x 1 condition x 3 reps x 2 models = 384 trials.
# Then: uv run python frontier/scripts/select_headroom.py frontier/runs/<this run id> frontier/runs/<track B screen>
# The three frontier models (these two, and Sonnet from track B's screen) pick the items; both tracks use them.
# Paths are relative to frontier/. Models come from frontier/config/models.yaml, not the main registry.
name: frontier-screen
models_file: config/models.yaml
model_set: frontier_models
case_files:
  - data/headroom.yaml
conditions:
  - no_belief
reps: 3
seed: 2046
shuffle_options: true
max_workers: 4
params:
  # The main study's settings, so results line up with it.
  temperature: 0.7
  max_tokens: 2000
  top_logprobs: 5
